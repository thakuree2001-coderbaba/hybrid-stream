{% extends 'base.html' %}
{% block title %}Catalog - Lucifer Donghua{% endblock %}

{% block content %}
<section class="section">
    <h2 class="section-heading"><i class="fa-solid fa-film"></i> Complete Library</h2>
    <div class="card-grid">
        {% for item in items %}
        <div class="donghua-card">
            <div class="img-wrapper">
                <img src="{{ item.img }}" alt="{{ item.title }}" loading="lazy">
                <a href="/watch?url={{ item.link }}" class="play-overlay"><i class="fa-solid fa-circle-play"></i></a>
            </div>
            <div class="card-info">
                <h3>{{ item.title }}</h3>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
