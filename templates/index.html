<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCIFER DONGHUA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="/" class="logo">LUCIFER <span>DONGHUA</span></a>
    </header>

    <div class="container">
        {% if active_stream %}
        <div class="player-wrapper">
            <iframe id="main-player" src="{{ active_stream }}" allowfullscreen referrerpolicy="no-referrer"></iframe>
        </div>
        {% endif %}

        <div class="section-title">Latest Donghua Episodes</div>
        <div class="grid">
            {% for item in items %}
            <a href="/watch?url={{ item.link }}" class="card">
                <img src="{{ item.img }}" alt="{{ item.title }}" loading="lazy">
                <div class="card-title">{{ item.title }}</div>
            </a>
            {% endfor %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
