<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniLucifer - Hybrid Anime & Donghua Stream</title>
    <style>
        :root {
            --bg-main: #0c0d12;
            --bg-card: #161822;
            --primary-red: #ff003c;
            --text-main: #f0f2f5;
            --text-muted: #9ba1b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: rgba(12, 13, 18, 0.95);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222533;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary-red); text-shadow: 0 0 10px rgba(255, 0, 60, 0.6); }

        .search-box {
            display: flex; background: var(--bg-card); padding: 0.4rem 0.8rem;
            border-radius: 20px; border: 1px solid #2a2e40; width: 280px;
        }
        .search-box input {
            background: transparent; border: none; color: white; width: 100%; outline: none;
        }

        .container { padding: 2rem 5%; max-width: 1400px; margin: 0 auto; }

        .player-container {
            display: none; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 2rem;
            border: 1px solid #2a2e40;
        }
        .player-frame { width: 100%; height: 450px; border: none; background: #000; }
        .player-controls {
            padding: 1rem; background: var(--bg-card); border-top: 1px solid #222533;
            display: flex; flex-direction: column; gap: 10px;
        }
        .ep-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        .ep-btn {
            background: #222533; border: 1px solid #3a3f58; color: white;
            padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem;
        }
        .ep-btn.active, .ep-btn:hover { background: var(--primary-red); border-color: var(--primary-red); }

        .filters { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn {
            background: var(--bg-card); border: 1px solid #2a2e40; color: white;
            padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-red); border-color: var(--primary-red);
        }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px;
        }

        .card {
            background: var(--bg-card); border-radius: 10px; overflow: hidden;
            transition: transform 0.2s; position: relative; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-details { padding: 10px; }
        .card-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge {
            position: absolute; top: 10px; left: 10px; background: var(--primary-red);
            font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold;
        }
        .meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ANI<span>LUCIFER</span></a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Donghua & Anime..." oninput="fetchCatalog()">
        </div>
    </header>

    <div class="container">
        <div id="playerContainer" class="player-container">
            <iframe id="videoPlayer" class="player-frame" src="" allowfullscreen></iframe>
            <div class="player-controls">
                <h3 id="nowPlayingTitle">Select an episode</h3>
                <div style="font-size: 0.85rem; color: var(--text-muted);">Episodes:</div>
                <div id="episodeList" class="ep-grid"></div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('All', this)">All Stream</button>
            <button class="filter-btn" onclick="setFilter('Donghua', this)">Donghua Only</button>
            <button class="filter-btn" onclick="setFilter('Anime', this)">Anime Only</button>
        </div>

        <div class="grid" id="mediaGrid"></div>
    </div>

    <script>
        let currentCategory = 'All';

        function setFilter(category, btn) {
            document.querySelectorAll('.filters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;
            fetchCatalog();
        }

        async function fetchCatalog() {
            const search = document.getElementById('searchInput').value;
            const res = await fetch(`/api/media?category=${currentCategory}&search=${search}`);
            const result = await res.json();
            
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = result.data.map(item => `
                <div class="card" onclick="loadPlayer(${item.id}, '${item.title}')">
                    <span class="badge">${item.category}</span>
                    <img src="${item.poster_url}" alt="${item.title}">
                    <div class="card-details">
                        <div class="card-title">${item.title}</div>
                        <div class="meta">
                            <span>${item.source_platform}</span>
                            <span style="color: #ffb703;">★ ${item.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadPlayer(mediaId, title) {
            const res = await fetch(`/api/episodes/${mediaId}`);
            const result = await res.json();
            const episodes = result.data;

            if (!episodes.length) return;

            const playerContainer = document.getElementById('playerContainer');
            const nowPlayingTitle = document.getElementById('nowPlayingTitle');
            const episodeList = document.getElementById('episodeList');
            
            playerContainer.style.display = 'block';
            nowPlayingTitle.innerText = `Now Playing: ${title}`;

            episodeList.innerHTML = episodes.map((ep, idx) => `
                <button class="ep-btn ${idx === 0 ? 'active' : ''}" onclick="changeEpisode('${ep.server_alpha}', this)">
                    EP ${ep.episode_num}
                </button>
            `).join('');

            changeEpisode(episodes[0].server_alpha, episodeList.children[0]);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeEpisode(streamUrl, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.getElementById('videoPlayer').src = streamUrl;
        }

        fetchCatalog();
    </script>
</body>
</html>
