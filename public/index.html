<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucifer Donghua</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0e12; color: #eceff4; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        header { background: #151821; border-bottom: 2px solid #e50914; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #e50914; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 25px; border: 1px solid #222634; }
        iframe { width: 100%; height: 100%; border: 0; }
        
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; border-left: 4px solid #e50914; padding-left: 10px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .card { background: #151821; border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid #1e2230; }
        .card img { width: 100%; height: 230px; object-fit: cover; display: block; }
        .card-body { padding: 10px; }
        .card-title { font-size: 13px; font-weight: 600; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; height: 36px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">LUCIFER <span>DONGHUA</span></a>
    </header>

    <div class="container">
        <div class="player-wrapper">
            <iframe id="embed-player" src="about:blank" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <div class="section-title">Latest Released Episodes</div>
        <div class="grid" id="content-grid"></div>
    </div>

    <script>
        async function loadStream(url) {
            const res = await fetch('/api/resolve?url=' + encodeURIComponent(url));
            const data = await res.json();
            if (data.stream) {
                document.getElementById('embed-player').src = data.stream;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function loadCatalog() {
            const res = await fetch('/api/latest');
            const data = await res.json();
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            data.forEach((item, index) => {
                if (index === 0) {
                    loadStream(item.url);
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                    </div>
                `;
                card.onclick = () => loadStream(item.url);
                grid.appendChild(card);
            });
        }

        loadCatalog();
    </script>
</body>
</html>
